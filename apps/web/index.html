<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/png" href="../../assets/brand/aib-128.png" />
    <title data-i18n="appTitle">AIB · 本地表格</title>
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="../../assets/brand/aib-128.png" width="48" height="48" alt="AIB" />
        <span data-i18n="brand">本地工作簿</span>
      </div>
      <div class="document">
        <strong id="name" data-i18n="openWorkbook">打开工作簿</strong
        ><small id="path" data-i18n="localFiles">你的表格，保存在你的电脑。</small>
      </div>
      <span id="status" role="status" data-i18n="ready">就绪</span
      ><button
        id="save"
        title="立即保存 (Ctrl+S / ⌘S)"
        disabled
        data-i18n-title="saveNow"
        data-i18n="save"
      >
        保存</button
      ><button
        id="syncDisk"
        title="检查并读取磁盘上的更改"
        disabled
        data-i18n-title="syncTitle"
        data-i18n="sync"
      >
        同步</button
      ><button id="open" data-i18n="open">打开文件</button
      ><button id="new" data-i18n="newFile">新建</button
      ><button id="import" data-i18n="importFile">导入</button
      ><button
        id="export"
        title="导出 Excel、CSV、HTML，或另存并打开 AIB 副本"
        data-i18n-title="exportTitle"
        data-i18n="exportFile"
      >
        导出</button
      ><button id="drafts" class="primary" data-i18n="drafts">AI 草稿</button>
      <select
        id="theme"
        aria-label="主题"
        title="界面主题"
        data-i18n-aria-label="theme"
        data-i18n-title="themeTitle"
      >
        <option value="system" data-i18n="systemTheme">跟随系统</option>
        <option value="light" data-i18n="light">浅色</option>
        <option value="dark" data-i18n="dark">深色</option>
      </select>
      <select
        id="language"
        aria-label="界面语言"
        title="界面语言"
        data-i18n-aria-label="language"
        data-i18n-title="language"
      >
        <option value="zh-CN" lang="zh-CN">简体中文</option>
        <option value="en-US" lang="en">English</option>
      </select>
    </header>
    <section id="toolbar" aria-label="编辑工具栏" data-i18n-aria-label="toolbar">
      <button data-action="undo" title="撤销本次编辑" data-i18n-title="undoTitle" data-i18n="undo">
        ↶ 撤销</button
      ><button data-action="redo" data-i18n="redo">↷ 重做</button><i></i>
      <fieldset id="fontTools" aria-label="单元格格式" disabled data-i18n-aria-label="cellFormat">
        <select
          id="fontSize"
          aria-label="字号"
          title="字号"
          data-i18n-aria-label="fontSize"
          data-i18n-title="fontSize"
        ></select>
        <button
          id="bold"
          class="font-toggle"
          aria-label="加粗"
          aria-pressed="false"
          title="加粗 (Ctrl+B)"
          data-i18n-aria-label="bold"
          data-i18n-title="boldTitle"
        >
          <b>B</b>
        </button>
        <button
          id="italic"
          class="font-toggle"
          aria-label="斜体"
          aria-pressed="false"
          title="斜体 (Ctrl+I)"
          data-i18n-aria-label="italic"
          data-i18n-title="italicTitle"
        >
          <em>I</em>
        </button>
        <button
          id="normal"
          aria-pressed="false"
          title="常规字形（取消加粗和斜体）"
          data-i18n-title="regular"
          data-i18n="regularFont"
        >
          常规
        </button>
        <button id="format" title="设置单元格格式" data-i18n-title="formatTitle" data-i18n="format">
          格式
        </button>
        <span class="color-tool" id="colorTool">
          <button
            id="color"
            class="color-apply"
            aria-label="应用字体颜色"
            data-i18n-aria-label="applyFontColor"
          >
            <span class="font-ink" aria-hidden="true">A</span>
          </button>
          <button
            id="colorMenu"
            class="color-menu"
            aria-label="选择字体颜色"
            aria-haspopup="dialog"
            aria-expanded="false"
            data-i18n-aria-label="chooseFontColor"
          >
            <span class="current-chip"></span>▾
          </button>
        </span>
        <span class="color-tool" id="backgroundTool">
          <button
            id="background"
            class="color-apply"
            aria-label="应用填充颜色"
            data-i18n-aria-label="applyFill"
          >
            <svg
              aria-hidden="true"
              width="18"
              height="18"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            >
              <path d="m3 10 7-7 6 6-7 7zM6 2l6 6M4 10h10" />
              <path
                d="M17 11s-2 2.5-2 3.5a2 2 0 0 0 4 0C19 13.5 17 11 17 11Z"
                fill="currentColor"
                stroke="none"
              />
            </svg>
          </button>
          <button
            id="backgroundMenu"
            class="color-menu"
            aria-label="选择填充颜色"
            aria-haspopup="dialog"
            aria-expanded="false"
            data-i18n-aria-label="chooseFill"
          >
            <span class="current-chip"></span>▾
          </button>
        </span>
        <span
          class="align-tools"
          role="group"
          aria-label="水平对齐"
          data-i18n-aria-label="alignment"
        >
          <button
            data-align="left"
            aria-label="左对齐"
            title="左对齐"
            aria-pressed="false"
            data-i18n-aria-label="left"
            data-i18n-title="left"
          >
            <span class="align-icon"></span>
          </button>
          <button
            data-align="center"
            aria-label="水平居中"
            title="水平居中"
            aria-pressed="false"
            data-i18n-aria-label="centerHoriz"
            data-i18n-title="centerHoriz"
          >
            <span class="align-icon"></span>
          </button>
          <button
            data-align="right"
            aria-label="右对齐"
            title="右对齐"
            aria-pressed="false"
            data-i18n-aria-label="right"
            data-i18n-title="right"
          >
            <span class="align-icon"></span>
          </button>
        </span>
      </fieldset>
      <select id="numberFormat" aria-label="数字格式" data-i18n-aria-label="numberFormat">
        <option value="General" data-i18n="normal">常规</option>
        <option value="0.00" data-i18n="decimal">两位小数</option>
        <option value="0.00%" data-i18n="percent">百分比</option>
        <option value="yyyy-mm-dd" data-i18n="date">日期</option>
        <option value="#,##0.00" data-i18n="thousands">千位分隔</option>
      </select>
      <button id="merge" data-i18n="merge">合并</button
      ><button id="unmerge" data-i18n="unmerge">取消合并</button
      ><button id="freeze" data-i18n="freeze">冻结</button><i></i>
      <button id="structure" data-i18n="structure">行 / 列</button
      ><button id="sheets" data-i18n="sheets">工作表</button
      ><button id="sort" data-i18n="sort">排序</button
      ><button id="filter" data-i18n="filter">筛选</button
      ><button id="find" data-i18n="findReplace">查找替换</button>
    </section>
    <div
      id="colorPalette"
      popover="auto"
      role="dialog"
      aria-label="颜色选择"
      data-i18n-aria-label="palette"
    >
      <button id="colorDefault" type="button"></button>
      <div class="palette-title" data-i18n="themeColors">主题颜色</div>
      <div id="themeSwatches" class="swatches"></div>
      <div class="palette-title" data-i18n="standardColors">标准色</div>
      <div id="standardSwatches" class="swatches"></div>
      <div id="recentColors" hidden>
        <div class="palette-title" data-i18n="recentColors">最近使用的颜色</div>
        <div id="recentSwatches" class="swatches"></div>
      </div>
      <label class="more-colors"
        ><span data-i18n="moreColors">其他颜色…</span
        ><input
          id="customColor"
          type="color"
          aria-label="自定义颜色"
          data-i18n-aria-label="customColor"
      /></label>
    </div>
    <section id="formula">
      <input
        id="cellAddress"
        aria-label="单元格地址"
        value="A1"
        data-i18n-aria-label="cellAddress"
      /><span>ƒx</span
      ><input
        id="formulaValue"
        aria-label="单元格内容或公式"
        placeholder="输入内容或 =公式，按 Enter 确认"
        data-i18n-aria-label="formulaValue"
        data-i18n-placeholder="formulaHint"
      />
    </section>
    <div id="message" role="alert" hidden></div>
    <div id="conflict" hidden>
      <strong data-i18n="conflictNotice">文件已在其他位置修改。你的网页编辑尚未覆盖原文件。</strong
      ><button id="download" data-i18n="backup">下载未保存副本</button
      ><button id="reload" data-i18n="reload">重新载入磁盘版本</button>
    </div>
    <main id="canvas">
      <div id="welcome">
        <span class="eyebrow" data-i18n="welcomeTag">本地编辑 · AI 协作</span>
        <h1 data-i18n="welcomeHeading">表格，回到文件本身。</h1>
        <p>
          <span data-i18n="welcomeFile">一个 .aib 文件，保存数据、公式与格式。</span><br /><span
            data-i18n="welcomeEdit"
            >在这里编辑，也可以交给 AI 通过 CLI 处理。</span
          >
        </p>
        <p class="hint" data-i18n="welcomeHint">
          点击“打开文件”选择本地工作簿，或使用 aib open 启动。
        </p>
      </div>
    </main>
    <footer>
      <span id="selection">A1</span
      ><span
        title="停止编辑 10 秒后自动保存。累计 20 次改动后，停顿 1 秒即可保存。持续编辑时每 60 秒安排一次。"
        data-i18n-title="autosaveTitle"
        data-i18n="autosaveHint"
        >自动保存已开启 · Ctrl+S 立即保存</span
      ><span id="sync" data-i18n="sharedFile">CLI 与网页共用同一文件</span>
      <button
        id="exportGuide"
        title="保存可交给大模型的 Markdown 指南"
        data-i18n-title="guideTitle"
        data-i18n="exportGuide"
      >
        导出离线处理指南
      </button>
    </footer>
    <dialog id="dialog">
      <form id="form">
        <div class="dialog-head">
          <h2 id="dialogTitle"></h2>
          <button type="button" id="cancel" aria-label="关闭" data-i18n-aria-label="close">
            ×
          </button>
        </div>
        <div id="fields"></div>
        <p id="dialogError" role="alert"></p>
        <div class="dialog-actions">
          <button type="submit" class="primary" id="submit" data-i18n="ok">确定</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
