name: "English · Feature request"
description: Describe a task you would like to accomplish with AIB.
labels: [enhancement]
body:
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What are you trying to do, and where do you get stuck?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired behavior
      description: An example workbench action, CLI command or workbook can help.
    validations:
      required: true
