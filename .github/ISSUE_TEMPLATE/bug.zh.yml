name: "中文 · 报告问题"
description: 报告可以复现的工作台、CLI 或文件转换问题。
labels: [bug]
body:
  - type: input
    id: environment
    attributes:
      label: 版本与环境
      placeholder: AIB 版本或提交号、操作系统、浏览器或 Node.js 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供操作步骤或 CLI 命令。如需样表，可使用最小的虚构示例。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
